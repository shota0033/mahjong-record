<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="麻雀成績">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>麻雀成績</title>
</head>
<body>
<div id="app">

  <!-- ホーム -->
  <section id="screen-home" class="screen">
    <h1 class="app-title">麻雀成績</h1>
    <div id="update-banner" class="card update" hidden>
      <p>新しいバージョンがあります</p>
      <button class="btn btn-primary" data-action="apply-update">更新する</button>
    </div>
    <div id="resume-banner" class="card resume" hidden>
      <p class="resume-title">進行中のセッションがあります</p>
      <p id="resume-info" class="muted"></p>
      <button class="btn btn-primary" data-action="resume">再開する</button>
    </div>
    <div class="home-buttons">
      <button class="btn btn-huge btn-primary" data-action="go-input">成績入力</button>
      <button class="btn btn-huge" data-action="go-review">成績確認</button>
    </div>
    <button id="home-backup" class="home-backup" data-action="go-settings"></button>
  </section>

  <!-- 対局タイプ選択 -->
  <section id="screen-type" class="screen" hidden>
    <header class="bar"><button class="btn-back" data-action="home">‹ 戻る</button><h2>対局タイプ</h2><span></span></header>
    <label class="field"><span>日付</span><input type="date" id="type-date"></label>
    <div class="type-buttons">
      <button class="btn btn-huge btn-primary" data-type="set">セット</button>
      <button class="btn btn-huge btn-primary" data-type="onRateFree">オンレートフリー</button>
      <button class="btn btn-huge btn-primary" data-type="noRateFree">ノーレートフリー</button>
    </div>
  </section>

  <!-- 店選択（オンレート） -->
  <section id="screen-shop" class="screen" hidden>
    <header class="bar"><button class="btn-back" data-action="back-type">‹ 戻る</button><h2>店を選択</h2><span></span></header>
    <div class="type-buttons">
      <button class="btn btn-huge btn-primary" data-shop="marchao">マーチャオ</button>
    </div>
  </section>

  <!-- 成績入力 -->
  <section id="screen-input" class="screen" hidden>
    <header class="bar"><button class="btn-back" data-action="home">‹ ホーム</button><h2 id="input-title"></h2><span id="sync-badge" class="sync-badge"></span></header>
    <div class="summary" id="input-summary"></div>
    <div class="num-display"><span class="nd-label" id="score-label">素点</span><span class="nd-value" id="score-value"></span><span class="unit" id="score-unit">点</span></div>
    <p class="preview" id="score-preview"></p>
    <div class="keypad" id="score-keypad"></div>
    <div class="field"><span>順位</span>
      <div class="rank-buttons" id="rank-buttons"></div>
    </div>
    <button class="btn btn-big btn-primary" data-action="confirm-game">確認</button>
    <button class="btn btn-big btn-outline-danger" data-action="end-session">終了</button>
    <div id="game-list" class="game-list"></div>
  </section>

  <!-- 金額入力（場代・持ちチップ・追加費用） -->
  <section id="screen-amount" class="screen" hidden>
    <header class="bar"><button class="btn-back" data-action="amount-back">‹ 戻る</button><h2 id="amount-title"></h2><span></span></header>
    <p class="muted small" id="amount-note"></p>
    <div class="num-display"><span class="nd-label" id="amount-label"></span><span class="nd-value" id="amount-value"></span><span class="unit">円</span></div>
    <div class="keypad" id="amount-keypad"></div>
    <button class="btn btn-big btn-primary" data-action="amount-confirm">確認</button>
    <button id="discard-btn" class="btn btn-outline-danger" data-action="discard-session" hidden>記録せずに破棄</button>
  </section>

  <!-- 結果 -->
  <section id="screen-result" class="screen" hidden>
    <div class="result-card">
      <p id="result-text"></p>
      <div id="result-sub" class="result-sub"></div>
    </div>
    <button class="btn btn-big btn-primary" data-action="home">確認</button>
  </section>

  <!-- 成績確認 -->
  <section id="screen-review" class="screen" hidden>
    <header class="bar"><button class="btn-back" data-action="home">‹ ホーム</button><h2>成績確認</h2><span></span></header>
    <nav class="tabs">
      <button data-tab="list">記録一覧</button>
      <button data-tab="stats">Data</button>
      <button data-tab="settings">設定</button>
    </nav>
    <div id="tab-list" class="tab"></div>
    <div id="tab-stats" class="tab" hidden></div>
    <div id="tab-settings" class="tab" hidden>
      <div class="card">
        <h3>データ</h3>
        <p id="data-summary" class="muted"></p>
        <button class="btn" data-action="export">JSONをエクスポート</button>
        <label class="btn" for="import-file">JSONをインポート</label>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
        <p id="persist-status" class="muted small"></p>
      </div>
      <div class="card">
        <h3>クラウド自動バックアップ</h3>
        <p class="muted small">Google Apps Script のURLを設定すると、半荘の確定や編集のたびに自動でGoogleドライブへ送信します（設定方法は README.md 参照）。</p>
        <label class="field"><span>ウェブアプリURL</span><input id="backup-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
        <label class="field"><span>合言葉（トークン）</span><input id="backup-token" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
        <button class="btn btn-primary" data-action="save-backup">保存して送信テスト</button>
        <p id="sync-status" class="muted small"></p>
        <button class="btn" data-action="sync-now">今すぐ送信</button>
        <button class="btn" data-action="restore-server">クラウドから復元</button>
      </div>
      <p class="muted small center">バージョン <span id="app-version"></span></p>
    </div>
  </section>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div id="modal-body"></div>
    <div id="modal-buttons" class="modal-buttons"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<div id="error-bar" class="error-bar" hidden>
  <p>エラーが発生しました。入力済みのデータは保存されています。</p>
  <p id="error-detail" class="small"></p>
  <button class="btn btn-primary" onclick="location.reload()">再読み込み</button>
</div>

<script src="app.js"></script>
</body>
</html>
